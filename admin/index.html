<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../assets/abhyas-mark.png">
<title>Admin &middot; Abhyas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css?v=6">
</head>
<body>

<!-- ============================================================
     Login gate. The real check happens server-side; this only
     hides the console until the session cookie exists.
     ============================================================ -->
<div class="ad-login-wrap" id="loginWrap">
  <form class="ad-login" id="loginForm">
    <span class="ad-kicker"><i></i> Abhyas · admin</span>
    <h1>Sign in</h1>
    <p>Publish a resource straight to the archive, or edit/remove one already live.</p>
    <p class="ad-err" id="loginErr" hidden></p>
    <label class="ad-field">
      <span>Password</span>
      <input type="password" id="pw" autocomplete="current-password" required>
    </label>
    <button class="ad-btn-primary" type="submit">Sign in</button>
  </form>
</div>

<!-- ============================================================
     Console
     ============================================================ -->
<div class="ad-shell" id="console" hidden>

  <div class="ad-top">
    <div class="ad-brand">
      <img src="../assets/abhyas-mark.png" alt="" width="34" height="34">
      <b>Abhyas</b>
      <span>Admin</span>
    </div>
    <div class="ad-topright">
      <span class="ad-who" id="who"></span>
      <button class="ad-logout" type="button" id="logout">Sign out</button>
    </div>
  </div>

  <div class="ad-stats">
    <div class="ad-stat is-live"><b id="sPublished">0</b><span>Published</span></div>
    <div class="ad-stat"><b id="sContrib">0</b><span>Contributors</span></div>
    <div class="ad-stat"><b id="sPending">0</b><span>Pending review</span></div>
  </div>

  <div class="ad-tabs" id="tabs" role="group" aria-label="Queue filter">
    <button class="ad-tab on" type="button" data-tab="pending">Pending <i id="cPending">0</i></button>
    <button class="ad-tab" type="button" data-tab="published">Published <i id="cPublished">0</i></button>
    <button class="ad-tab" type="button" data-tab="trash">Trash <i id="cTrash">0</i></button>
  </div>

  <div class="ad-toolbar">
    <input class="ad-search" type="search" id="search" placeholder="Search by title, code, or contributor&hellip;">
    <button class="ad-review-btn" type="button" id="btnAdd">+ Add resource</button>
  </div>

  <!-- Reuses the site's own .pill component (styles.css) rather than a
       second filter-pill implementation just for the admin console. -->
  <div class="ad-filters" id="filterBar">
    <div class="pills">
      <button class="pill on" data-kind="all" type="button"><i></i> Everything</button>
      <button class="pill" data-kind="papers" type="button"><i style="background:var(--papers)"></i> Past papers</button>
      <button class="pill" data-kind="notes" type="button"><i style="background:var(--notes)"></i> Notes</button>
      <button class="pill" data-kind="assignment" type="button"><i style="background:var(--assignment)"></i> Assignments</button>
      <button class="pill" data-kind="reference" type="button"><i style="background:var(--reference)"></i> Reference</button>
    </div>
    <select class="ad-filter-select" id="filterDept"><option value="all">Branch: All</option></select>
    <select class="ad-filter-select" id="filterYear"><option value="all">Year: All</option></select>
  </div>

  <div class="ad-queue" id="queue"></div>
</div>

<!-- ============================================================
     Add / edit — PDF preview on the left, editable metadata on
     the right. When adding, the preview is the file you just
     picked, rendered entirely in your browser before anything is
     uploaded. When editing, it's the file already live on the site.
     ============================================================ -->
<div class="ad-review" id="review" role="dialog" aria-modal="true" aria-labelledby="revTitle">
  <div class="ad-review-back" id="reviewBack"></div>
  <div class="ad-review-panel">

    <div class="ad-pdf" id="pdfPane"></div>

    <div class="ad-side">
      <div class="ad-side-head">
        <h2 id="revTitle">Add resource</h2>
        <button class="ad-close" type="button" id="revClose" aria-label="Close">&times;</button>
      </div>

      <div class="ad-side-body">
        <p class="ad-warn" id="dupeWarn" hidden></p>
        <p class="ad-hint" id="submissionInfo" hidden></p>

        <label class="ad-field" id="fileField">
          <span>PDF file</span>
          <input type="file" id="fFile" accept="application/pdf">
        </label>

        <label class="ad-field">
          <span>Course code</span>
          <input type="text" id="fCode" list="codeList" placeholder="CS2110">
        </label>
        <datalist id="codeList"></datalist>
        <p class="ad-hint" id="codeHint" hidden></p>

        <label class="ad-field">
          <span>Course name</span>
          <input type="text" id="fCourse">
        </label>

        <label class="ad-field">
          <span>Branch</span>
          <select id="fDept"></select>
        </label>

        <div class="ad-row2">
          <label class="ad-field">
            <span>Type</span>
            <select id="fType">
              <option value="papers">Past paper / quiz</option>
              <option value="notes">Notes / slides</option>
              <option value="assignment">Assignment / lab</option>
              <option value="reference">Reference book</option>
            </select>
          </label>
          <label class="ad-field">
            <span>Year</span>
            <input type="number" id="fYear" min="2000" max="2100">
          </label>
        </div>

        <label class="ad-field">
          <span>Exam type</span>
          <select id="fExam">
            <option value="">&mdash;</option>
            <option>Mid-Sem</option>
            <option>End-Sem</option>
            <option>Quiz</option>
            <option>Makeup</option>
          </select>
        </label>

        <!-- Reference books carry the payload library.html renders. Without it
             the Bookshelf filters the record out and the shelf shows nothing. -->
        <div id="bookFields" hidden>
          <div class="ad-row2">
            <label class="ad-field"><span>Book author</span><input type="text" id="fBookAuthor"></label>
            <label class="ad-field"><span>Publisher</span><input type="text" id="fBookPublisher"></label>
          </div>
          <label class="ad-field">
            <span>Cover</span>
            <select id="fBookCover">
              <option value="ink">Ink</option><option value="amber">Amber</option>
              <option value="crimson">Crimson</option><option value="mint">Mint</option>
              <option value="violet">Violet</option><option value="sky">Sky</option>
            </select>
          </label>
          <label class="ad-field"><span>One-line gist</span><textarea id="fBookGist" rows="2"></textarea></label>
        </div>

        <label class="ad-field">
          <span>Professor</span>
          <input type="text" id="fProf" placeholder="Comma-separated if more than one">
        </label>

        <div class="ad-row2">
          <label class="ad-field">
            <span>Contributor</span>
            <input type="text" id="fContrib" placeholder="Leave blank for no credit">
          </label>
          <label class="ad-field">
            <span>Batch</span>
            <input type="text" id="fRoll" placeholder="CS23">
          </label>
        </div>
      </div>

      <div class="ad-side-foot">
        <button class="ad-reject" type="button" id="btnDelete" hidden>Delete</button>
        <button class="ad-reject" type="button" id="btnReject" hidden>Reject</button>
        <button class="ad-approve" type="button" id="btnSave">Publish</button>
      </div>
    </div>

  </div>
</div>

<!-- Same toast used site-wide (styles.css) — not a separate admin-only notification system. -->
<div class="toast" id="toast" aria-live="polite" hidden></div>

<script src="../data.js?v=12"></script>
<script src="admin.js?v=14"></script>
</body>
</html>
